<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#142820"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>Poker Log 2.0</title><style>
*{box-sizing:border-box}body{margin:0 auto;max-width:600px;padding:12px 12px 100px;background:#101e19;color:#eef7ef;font:16px system-ui}h1{font-size:23px;margin:8px 0}h2{font-size:18px}button,select,input,textarea{font:inherit;color:inherit;background:#293f35;border:1px solid #617e6e;border-radius:9px;padding:10px;min-height:44px}button{touch-action:manipulation;cursor:pointer}button.primary,.hero{background:#afe5bf;color:#142820;font-weight:bold}small{color:#b9cfc1}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top label{flex:1;font-size:13px}.top select{display:block;width:100%;margin-top:4px}.table{position:relative;height:340px;background:#142820;border-radius:18px;margin:12px 0;overflow:hidden}.felt{position:absolute;left:12%;right:12%;top:23%;bottom:23%;background:#255a43;border:3px solid #709581;border-radius:48%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.seat{position:absolute;transform:translate(-50%,-50%);width:clamp(53px,17%,84px);padding:5px 2px;font-size:12px;min-height:48px;z-index:2;line-height:1.3}.seat small{display:block;font-size:10px;color:inherit}.seat.marked:not(.hero){background:#407d60}.cards{display:flex;gap:3px;justify-content:center}.card{background:#fafbf9;color:#142820;width:clamp(32px,8.5vw,48px);height:48px;padding:2px;font-weight:bold;font-size:16px}.red{color:#b8243b}.heroCards .card{height:44px}.bar{position:fixed;bottom:0;left:0;right:0;background:#101e19;display:flex;justify-content:center;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));z-index:4;border-top:1px solid #40594b}.bar button{flex:1;max-width:180px}.sheet{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:10}.sheet[hidden]{display:none}.panel{background:#20352b;border-radius:20px 20px 0 0;width:100%;max-width:600px;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:85dvh;overflow:auto}.panel textarea{display:block;width:100%;margin:4px 0 10px;min-height:48px;resize:vertical}.panel label{font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row h2{flex:1;margin:0}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}.grid button{padding:5px}.suits{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.suits button{background:white;color:#142820;font-size:24px}.suits .red{color:#b8243b}.entry{border-bottom:1px solid #40594b;padding:12px 0}.entry button{margin:4px 4px 0 0}#status{font-size:12px;color:#b9cfc1;min-height:18px}#history{margin-top:20px}textarea{width:100%} .full{width:100%;margin-top:8px} @media(max-width:360px){body{padding-left:6px;padding-right:6px}.table{height:320px}.seat{font-size:11px}.card{width:30px}}
</style></head><body><h1>♠ Poker Log <small>2.0</small></h1><div id="status" role="status"></div><div class="top"><label>卓人数<select id="num"></select></label><label>自分の位置<select id="hero"></select></label></div><div id="table" class="table"></div><small>座席をタップしてメモ。記録不要な人はそのままでOK。</small><div class="row" style="margin-top:12px"><button onclick="general()">結果・全体メモ（任意）</button></div><section id="history" hidden></section><div class="bar"><button class="primary" onclick="save()">保存</button><button onclick="nextHand()">次のハンド</button><button onclick="showHistory()">履歴</button></div><div class="sheet" id="sheet" hidden><div class="panel" id="panel"></div></div><script>
const $=s=>document.querySelector(s), streets=['プリフロップ','フロップ','ターン','リバー'], ranks=[...'AKQJT98765432'], suits=['♠','♥','♦','♣'], positions={2:['BTN/SB','BB'],3:['BTN','SB','BB'],4:['CO','BTN','SB','BB'],5:['HJ','CO','BTN','SB','BB'],6:['UTG','HJ','CO','BTN','SB','BB'],7:['UTG','LJ','HJ','CO','BTN','SB','BB'],8:['UTG','UTG+1','LJ','HJ','CO','BTN','SB','BB'],9:['UTG','UTG+1','UTG+2','LJ','HJ','CO','BTN','SB','BB']};const clone=x=>JSON.parse(JSON.stringify(x));const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}function valid(x){return x&&positions[x.n]&&Array.isArray(x.cards)&&x.cards.length===7&&positions[x.n].includes(x.hero)}function fresh(n=9,hero='BTN'){return {n,hero:positions[n].includes(hero)?hero:positions[n][0],cards:Array(7).fill(''),notes:{},active:[[],[],[],[]],actions:[[],[],[],[]],result:'未記録',note:'',id:null}}function normalize(x){x=clone(x);if(!x.notes){x.notes={};(x.actions||[]).forEach((a,i)=>{if(!Array.isArray(a)||i>3)return;a.forEach(v=>{if(!positions[x.n].includes(v.who))return;let z=x.notes[v.who]??=Array(4).fill('');z[i]+=(z[i]?'、':'')+v.act+(v.amt!==''&&v.amt!=null?' '+v.amt+'BB':'')})})}return x}let raw=read('pokerlogs1',[]),logs=Array.isArray(raw)?raw.filter(valid).map(normalize):[],d=read('pokerDraft',null),h=valid(d)?normalize(d):fresh(),selected=null,slot=0,rank=null,returnSeat=null;function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){$('#status').textContent='保存失敗：バックアップを取ってください';return false}}function draft(){if(store('pokerDraft',h))$('#status').textContent='下書き自動保存済み'}function cardButton(i){let c=h.cards[i];return `<button class="card ${/[♥♦]/.test(c)?'red':''}" onclick="pick(${i})" aria-label="${['手札1','手札2','フロップ1','フロップ2','フロップ3','ターン','リバー'][i]}">${esc(c||'＋')}</button>`}function render(){let p=positions[h.n];$('#num').innerHTML=Object.keys(positions).map(n=>`<option value="${n}" ${n==h.n?'selected':''}>${n}人</option>`).join('');$('#hero').innerHTML=p.map(v=>`<option ${v===h.hero?'selected':''}>${v}</option>`).join('');$('#table').innerHTML=`<div class="felt"><small>フロップ　　T　 R</small><div class="cards">${[2,3,4,5,6].map(cardButton).join('')}</div><small>自分のハンド</small><div class="cards heroCards">${[0,1].map(cardButton).join('')}</div></div>`+p.map((v,i)=>{let a=2*Math.PI*i/p.length;let x=50+40*Math.sin(a),y=50-40*Math.cos(a),marked=(h.notes[v]||[]).some(t=>t.trim());return `<button class="seat ${v===h.hero?'hero':''} ${marked?'marked':''}" style="left:${x}%;top:${y}%" onclick="seat('${v}')">${v}<small>${v===h.hero?'自分':marked?'記録あり':'—'}</small></button>`}).join('');draft()}
$('#num').onchange=e=>{let n=+e.target.value;if(Object.values(h.notes).some(a=>a.some(Boolean))&&!confirm('卓人数を変更しますか？ 対応しない座席のメモは削除されます。')){render();return}h.n=n;if(!positions[n].includes(h.hero))h.hero=positions[n][0];h.notes=Object.fromEntries(Object.entries(h.notes).filter(([p])=>positions[n].includes(p)));render()};$('#hero').onchange=e=>{h.hero=e.target.value;render()};function open(html){$('#panel').innerHTML=html;$('#sheet').hidden=false}function closeSheet(){$('#sheet').hidden=true;render()}function seat(p){selected=p;h.notes[p]??=Array(4).fill('');open(`<div class="row"><h2>${p}${p===h.hero?'（自分）':''} のメモ</h2><button onclick="closeSheet()">閉じる</button></div>${p===h.hero?`<div class="cards heroCards">${[0,1].map(i=>cardButton(i).replace(`pick(${i})`,`pick(${i},true)`)).join('')}</div>`:''}${streets.map((s,i)=>`<label>${s}<textarea rows="1" placeholder="${['例：3BB R、C','例：X、5BB C','例：半ポット B','例：X'][i]}" oninput="memo(${i},this.value)">${esc(h.notes[p][i])}</textarea></label>`).join('')}<button class="primary full" onclick="closeSheet()">完了</button>`)}function memo(i,v){h.notes[selected][i]=v;draft()}function pick(i,back=false){slot=i;rank=null;returnSeat=back?selected:null;picker()}function picker(){open(`<div class="row"><h2>${['手札1','手札2','フロップ1','フロップ2','フロップ3','ターン','リバー'][slot]}</h2><button onclick="finishPick()">完了</button></div><div class="grid">${ranks.map(r=>`<button class="${rank===r?'primary':''}" onclick="rank='${r}';picker()">${r}</button>`).join('')}</div><div class="suits">${suits.map(s=>`<button class="${/[♥♦]/.test(s)?'red':''}" onclick="choose('${s}')">${s}</button>`).join('')}</div><button class="full" onclick="h.cards[slot]='';draft();finishPick()">このカードを消す</button>`)}function choose(s){if(!rank)return alert('数字を選択してください');let c=rank+s;if(h.cards.some((v,i)=>v===c&&i!==slot))return alert('同じカードが入力済みです');h.cards[slot]=c;draft();if(slot===0||slot===2||slot===3){slot++;rank=null;picker()}else finishPick()}function finishPick(){let p=returnSeat;returnSeat=null;if(p)seat(p);else closeSheet()}function general(){open(`<div class="row"><h2>結果・全体メモ</h2><button onclick="closeSheet()">閉じる</button></div><select onchange="h.result=this.value;draft()">${['未記録','勝ち','負け','フォールド','引き分け'].map(v=>`<option ${v===h.result?'selected':''}>${v}</option>`).join('')}</select><textarea rows="4" placeholder="気になったことなど" oninput="h.note=this.value;draft()">${esc(h.note)}</textarea><button class="primary full" onclick="closeSheet()">完了</button>`)}function save(quiet=false){let x=clone(h);x.id=x.id||Date.now();x.date=x.date||new Date().toLocaleString('ja-JP');let a=logs.slice(),i=a.findIndex(l=>l.id===x.id);if(i<0)a.unshift(x);else a[i]=x;if(!store('pokerlogs1',a))return false;logs=a;h=x;draft();if(!quiet)$('#status').textContent='ハンドを保存しました（'+logs.length+'件）';if(!$('#history').hidden)history();return true}function nextHand(){if(h.cards.some(Boolean)||Object.values(h.notes).some(a=>a.some(t=>t.trim()))||h.note||h.result!=='未記録'){if(!save(true))return}h=fresh(h.n,h.hero);render();if(!$('#history').hidden)history();$('#status').textContent='新しいハンド：自分の位置を確認してください'}function showHistory(){$('#history').hidden=!$('#history').hidden;if(!$('#history').hidden){history();$('#history').scrollIntoView({behavior:'smooth'})}}function history(){$('#history').innerHTML=`<h2>保存済み：${logs.length}件</h2><div class="row"><button onclick="exportText()">復習用TXT</button><button onclick="download(JSON.stringify(logs,null,2),'poker_backup.json')">JSONバックアップ</button><button onclick="document.getElementById('restore').click()">復元</button><input hidden type="file" id="restore" accept=".json" onchange="restore(this)"></div>`+logs.map((l,i)=>`<div class="entry"><small>${esc(l.date)} / ${l.n}人 / ${esc(l.hero)}</small><div>${esc(l.cards.slice(0,2).join(' ')||'未入力')}　${esc(l.result)}</div><small>ボード：${esc(l.cards.slice(2).join(' '))}</small><div><button onclick="load(${i})">開く・編集</button><button onclick="removeLog(${i})">削除</button></div></div>`).join('')}function load(i){if(!confirm('現在の下書きを置き換えますか？ 未保存の変更は失われます。'))return;h=normalize(logs[i]);render();window.scrollTo(0,0)}function removeLog(i){if(!confirm('この記録を削除しますか？'))return;let a=logs.filter((_,j)=>j!==i);if(store('pokerlogs1',a)){logs=a;history()}}function download(t,name){let u=URL.createObjectURL(new Blob([t],{type:name.endsWith('.json')?'application/json':'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}function exportText(){download(logs.map(l=>`${l.date} / ${l.n}人卓 / 自分 ${l.hero} / ${l.cards.slice(0,2).join(' ')}\n${streets.map((s,i)=>`${s} ボード: ${i===0?'なし':l.cards.slice(2,i+4).join(' ')}\n${positions[l.n].filter(p=>l.notes[p]?.[i]).map(p=>p+': '+l.notes[p][i]).join('\n')}${l.active?.[i]?.length?'\n旧版参加者: '+l.active[i].join(', '):''}`).join('\n')}\n結果: ${l.result}\nメモ: ${l.note||''}`).join('\n\n---\n\n'),'poker_review.txt')}async function restore(el){try{let a=JSON.parse(await el.files[0].text());if(!Array.isArray(a)||!a.every(valid))throw Error();if(confirm('現在の記録に追加しますか？')){let b=logs.slice();for(let l of a)if(!b.some(x=>x.id===l.id))b.push(normalize(l));if(store('pokerlogs1',b)){logs=b;history()}}}catch(e){alert('バックアップを読み込めませんでした')}}render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
