<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#101c19"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>ポーカーハンド記録</title><style>body{font:16px system-ui;background:#101c19;color:#edf5ef;max-width:900px;margin:auto;padding:16px}section{background:#20332d;border:1px solid #3d554b;border-radius:14px;padding:16px;margin:12px 0}button,select,input,textarea{font:inherit;border:1px solid #678075;border-radius:8px;padding:9px;background:#14241f;color:white;margin:3px}button{cursor:pointer}button.on{background:#a5e4b9;color:#10251a}button.primary{background:#a5e4b9;color:#10251a;font-weight:bold}h2{font-size:18px}small{color:#b8c9bf}.cards{display:flex;flex-wrap:wrap;gap:4px}.card{background:#fff;color:#18221e;min-width:45px;height:60px;font-weight:bold}.red{color:#b21d35}.muted{opacity:.45}textarea{width:95%}pre{white-space:pre-wrap} .line{display:flex;flex-wrap:wrap;align-items:center;gap:4px} button,select,input{min-height:44px;box-sizing:border-box}button{touch-action:manipulation}.tabletop{position:relative;height:230px;background:#285a43;border:5px solid #567966;border-radius:48%;margin:16px 0}.seat{position:absolute;transform:translate(-50%,-50%);font-size:12px;margin:0;padding:6px;min-width:54px}.centerlabel{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);text-align:center}.sticky{position:sticky;bottom:0;background:#101c19;padding:8px;z-index:3;display:flex;justify-content:center}body{padding-bottom:env(safe-area-inset-bottom)}@media(max-width:480px){body{padding:10px}section{padding:10px}.card{min-width:39px;padding:5px}.cards{gap:1px}h1{font-size:24px}} </style><h1>♠ ポーカーハンド記録</h1><small>トーナメント用・端末内保存</small><div id="status" role="status"></div><div id="app"></div><div class="sticky"><button class="primary" onclick="save()">保存</button><button onclick="reset()">新規</button><button onclick="document.getElementById('history').scrollIntoView()">履歴</button></div><script>
const $=s=>document.querySelector(s), ranks='AKQJT98765432'.split(''), suits=['♠','♥','♦','♣'], streets=['プリフロップ','フロップ','ターン','リバー'];const positions={2:['BTN/SB','BB'],3:['BTN','SB','BB'],4:['CO','BTN','SB','BB'],5:['HJ','CO','BTN','SB','BB'],6:['UTG','HJ','CO','BTN','SB','BB'],7:['UTG','LJ','HJ','CO','BTN','SB','BB'],8:['UTG','UTG+1','LJ','HJ','CO','BTN','SB','BB'],9:['UTG','UTG+1','UTG+2','LJ','HJ','CO','BTN','SB','BB']};let logs=[];try{logs=JSON.parse(localStorage.getItem('pokerlogs1')||'[]')}catch(e){};let h,slot=0,rank='A';function fresh(){h={n:9,hero:'BTN',cards:Array(7).fill(''),active:[[],[],[],[]],actions:[[],[],[],[]],result:'未記録',note:'',id:null};h.active[0]=positions[9].slice();slot=0;render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function btn(t,js,on=false){return `<button class="${on?'on':''}" onclick="${js}">${esc(t)}</button>`}function draft(){try{localStorage.setItem("pokerDraft",JSON.stringify(h));$("#status").textContent="下書き自動保存済み"}catch(e){$("#status").textContent="端末保存に失敗しました"}}function render(){draft();let p=positions[h.n];$('#app').innerHTML=`<section><h2>1. 卓と自分の位置</h2>${[2,3,4,5,6,7,8,9].map(n=>btn(n+'人',`setN(${n})`,h.n===n)).join('')}<div class="tabletop"><div class="centerlabel">自分の座席を選択<br>${esc(h.hero)}</div>${p.map((x,j)=>`<button class="seat ${h.hero===x?'on':''}" style="left:${50+39*Math.sin(2*Math.PI*j/p.length)}%;top:${50-39*Math.cos(2*Math.PI*j/p.length)}%" onclick="hero('${x}')">${x}</button>`).join('')}</div></section><section><h2>2. ハンドとボード</h2><small>カード枠を選択 → 数字 → マーク（次の枠へ自動移動）</small><div class="cards">${h.cards.map((c,i)=>`<div><small>${['手札1','手札2','F1','F2','F3','Turn','River'][i]}</small><br><button class="card ${/[♥♦]/.test(c)?'red':''}" style="outline:${slot===i?'3px solid #83dca1':'none'}" onclick="slot=${i};render()">${c||'＋'}</button></div>`).join('')}</div><p>${ranks.map(r=>btn(r,`rank='${r}';render()`,rank===r)).join('')}</p>${suits.map(s=>btn(s,`card('${s}')`)).join('')}${btn('枠を消す','h.cards[slot]=\'\';render()')}</section>${streets.map((s,i)=>`<section><h2>${i+3}. ${s}</h2><small>残っている人を選択（自分も含む）</small><div>${p.map(x=>btn(x+(x===h.hero?' 自分':''),`toggle(${i},'${x}')`,h.active[i].includes(x))).join('')}</div>${i?btn('前のストリートから引き継ぐ',`inherit(${i})`):''}<p>アクション（順番に追加）</p><div class="line"><select id="who${i}">${p.map(x=>`<option>${x}</option>`).join('')}</select><select id="act${i}">${['フォールド','チェック','コール','ベット','レイズ','オールイン','リンプ','3ベット','4ベット'].map(x=>`<option>${x}</option>`).join('')}</select><input id="amt${i}" type="number" min="0" placeholder="額 BB (任意)" style="width:115px">${btn('追加',`add(${i})`)}</div>${h.actions[i].map((a,j)=>`<div>${j+1}. ${esc(a.who)} ${esc(a.act)} ${a.amt!==''?esc(a.amt)+' BB':''} ${btn('削除',`h.actions[${i}].splice(${j},1);render()`)}</div>`).join('')}</section>`).join('')}<section><h2>7. 結果</h2>${['未記録','勝ち','負け','フォールド','引き分け'].map(x=>btn(x,`h.result='${x}';render()`,h.result===x)).join('')}<p><textarea placeholder="メモ（任意）" oninput="h.note=this.value;draft()">${esc(h.note)}</textarea></p><button class="primary" onclick="save()">ハンドを保存</button>${btn('新規ハンド','reset()')}</section><section id="history"><h2>保存済み：${logs.length}件</h2>${btn('復習用テキスト出力','exportText()')}${btn('JSONバックアップ','download(JSON.stringify(logs,null,2),\'poker_backup.json\')')}<input type="file" accept=".json" onchange="restore(this)">${logs.map((l,i)=>`<p>${esc(l.date)} | ${esc(l.hero)} | ${esc(l.cards.slice(0,2).join(' '))} | ${esc(l.result)} ${btn('開く',`load(${i})`)}${btn('削除',`removeLog(${i})`)}</p>`).join('')}</section>`}function setN(n){h.n=n;h.hero=positions[n].includes(h.hero)?h.hero:positions[n][0];h.active=h.active.map(a=>a.filter(x=>positions[n].includes(x)));h.active[0]=positions[n].slice();h.actions=h.actions.map(a=>a.filter(x=>positions[n].includes(x.who)));render()}function hero(x){h.hero=x;render()}function card(s){let c=rank+s;if(h.cards.some((x,i)=>x===c&&i!==slot)){alert('同じカードが既にあります');return}h.cards[slot]=c;slot=Math.min(6,slot+1);render()}function toggle(i,x){let a=h.active[i];h.active[i]=a.includes(x)?a.filter(y=>y!==x):[...a,x];render()}function inherit(i){h.active[i]=h.active[i-1].filter(x=>!h.actions[i-1].some(a=>a.who===x&&a.act==='フォールド'));render()}function add(i){h.actions[i].push({who:$('#who'+i).value,act:$('#act'+i).value,amt:$('#amt'+i).value});render()}function persist(){try{localStorage.setItem('pokerlogs1',JSON.stringify(logs));return true}catch(e){alert('端末保存に失敗しました。バックアップを出力してください。');return false}}function save(){if(!h.cards[0]||!h.cards[1])return alert('手札2枚を入力してください');h.id=h.id||Date.now();h.date=new Date().toLocaleString('ja-JP');let i=logs.findIndex(l=>l.id===h.id);if(i<0)logs.unshift(JSON.parse(JSON.stringify(h)));else logs[i]=JSON.parse(JSON.stringify(h));if(persist())alert('保存しました');render()}function reset(){if(confirm('入力中の内容をクリアしますか？'))fresh()}function load(i){h=JSON.parse(JSON.stringify(logs[i]));slot=0;render();window.scrollTo(0,0)}function removeLog(i){if(confirm('削除しますか？')){logs.splice(i,1);persist();render()}}function download(t,name){let u=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportText(){download(logs.map(l=>`${l.date} / ${l.n}人卓 / 自分 ${l.hero} / ${l.cards.slice(0,2).join(' ')}\n${streets.map((s,i)=>`${s} ボード: ${i===0?'なし':l.cards.slice(2,i+4).join(' ')} / 参加者: ${l.active[i].join(', ')}\n${l.actions[i].map(a=>`${a.who}: ${a.act} ${a.amt?a.amt+'BB':''}`).join('\n')}`).join('\n')}\n結果: ${l.result}\nメモ: ${l.note}`).join('\n\n---\n\n'),'poker_review.txt')}async function restore(el){try{let a=JSON.parse(await el.files[0].text());if(!Array.isArray(a)||!a.every(l=>positions[l.n]&&Array.isArray(l.cards)&&l.cards.length===7&&Array.isArray(l.active)&&l.active.length===4&&l.active.every(Array.isArray)&&Array.isArray(l.actions)&&l.actions.length===4&&l.actions.every(Array.isArray)))throw Error();if(confirm('バックアップを現在の記録に追加しますか？')){logs=[...logs,...a.filter(l=>!logs.some(x=>x.id===l.id))];persist();render()}}catch(e){alert('バックアップを読み込めませんでした')}}try{h=JSON.parse(localStorage.getItem("pokerDraft"));if(!h||!positions[h.n])throw Error();render()}catch(e){fresh()}if("serviceWorker" in navigator && location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});</script></html>
